<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Twelve named modules grouped into three lab tiers, converging on a single capstone at the end, module 1 highlighted as the on-ramp.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="420">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#757575"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="420" fill="white"/>
  <text x="540" y="30" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e1e1e">Your journey through twelve modules</text>

  <text x="335" y="65" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="#757575">Tier 0-1: language + cloud API</text>
  <text x="920" y="65" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="#757575">Tier 2: kubernetes</text>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" fill="#1e1e1e" text-anchor="middle" stroke="#1e1e1e" stroke-width="1.6">
    <circle cx="60"  cy="110" r="24" fill="#ffe6cc" filter="url(#sketch)"/>
    <circle cx="140" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="220" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="300" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="380" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="460" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="540" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="620" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="700" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="840" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="920" cy="110" r="24" fill="white" filter="url(#sketch)"/>
    <circle cx="1000" cy="110" r="24" fill="white" filter="url(#sketch)"/>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <text x="60"  y="115">1</text><text x="140" y="115">2</text><text x="220" y="115">3</text>
    <text x="300" y="115">4</text><text x="380" y="115">5</text><text x="460" y="115">6</text>
    <text x="540" y="115">7</text><text x="620" y="115">8</text><text x="700" y="115">9</text>
    <text x="840" y="115">10</text><text x="920" y="115">11</text><text x="1000" y="115">12</text>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="10.5" fill="#1e1e1e" text-anchor="middle">
    <text x="60" y="152">ClickOps</text><text x="60" y="164">to Agents</text>
    <text x="140" y="152">Your</text><text x="140" y="164">Workstation</text>
    <text x="220" y="152">Context</text><text x="220" y="164">Engineering</text>
    <text x="300" y="152">Agent</text><text x="300" y="164">Skills</text>
    <text x="380" y="152">MCP</text><text x="380" y="164">+ Tools</text>
    <text x="460" y="152">Guardrails</text>
    <text x="540" y="152">Spec-Driven</text><text x="540" y="164">Infra</text>
    <text x="620" y="152">Harness</text><text x="620" y="164">Engineering</text>
    <text x="700" y="152">Verify</text><text x="700" y="164">AI Infra</text>
    <text x="840" y="152">Kubernetes</text><text x="840" y="164">+ Platform</text>
    <text x="920" y="152">GitOps</text><text x="920" y="164">+ Pipelines</text>
    <text x="1000" y="152">Loop</text><text x="1000" y="164">+ Multi-Agent</text>
  </g>

  <path d="M60,136 C 250,260 700,300 850,335" stroke="#757575" stroke-width="2.2" fill="none" marker-end="url(#arrow)" filter="url(#sketch)"/>
  <path d="M1000,136 C 1000,220 970,300 930,332" stroke="#757575" stroke-width="2.2" fill="none" marker-end="url(#arrow)" filter="url(#sketch)"/>

  <g stroke="#1e1e1e" stroke-width="2.6" fill="#ffe6cc" filter="url(#sketch)">
    <rect x="840" y="345" width="160" height="55" rx="8"/>
  </g>
  <text x="920" y="378" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="16" fill="#1e1e1e">Capstone</text>

  <text x="380" y="330" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="#1e1e1e">you are here, module 1, the on-ramp</text>
</svg>
