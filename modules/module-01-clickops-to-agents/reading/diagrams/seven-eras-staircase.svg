<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seven ascending steps: ClickOps, scripts, configuration management, declarative IaC, GitOps, AI-assisted, agentic, each taller than the last.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="520">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="white"/>

  <text x="600" y="38" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="24" fill="black">The seven eras: each one raises where intent is stated</text>

  <line x1="20" y1="420" x2="1180" y2="422.0" stroke="black" stroke-width="2.5" filter="url(#sketch)"/>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" fill="black" stroke="black">
    <rect x="50"  y="370" width="130" height="50"  fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="210" y="335" width="130" height="85"  fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="370" y="300" width="130" height="120" fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="530" y="265" width="130" height="155" fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="690" y="230" width="130" height="190" fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="850" y="195" width="130" height="225" fill="white" stroke-width="2" filter="url(#sketch)"/>
    <rect x="1010" y="160" width="130" height="260" fill="white" stroke-width="2" filter="url(#sketch)"/>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="15" fill="black" text-anchor="middle">
    <text x="115"  y="400">ClickOps</text>
    <text x="275"  y="382">Scripts</text>
    <text x="435"  y="365">Config mgmt</text>
    <text x="595"  y="348">Declarative</text>
    <text x="595"  y="366">IaC</text>
    <text x="755"  y="330">GitOps</text>
    <text x="915"  y="313">AI-assisted</text>
    <text x="1075" y="297">Agentic</text>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="12" fill="black" text-anchor="middle" font-style="italic">
    <text x="115"  y="450">console, mouse</text>
    <text x="275"  y="450">shell $</text>
    <text x="435"  y="450">Puppet / Chef / Ansible</text>
    <text x="595"  y="450">Terraform</text>
    <text x="755"  y="450">git + reconcile</text>
    <text x="915"  y="450">chat window</text>
    <text x="1075" y="450">generate-verify-fix</text>
  </g>

  <g stroke="black" stroke-width="2" fill="none" filter="url(#sketch)">
    <path d="M60,480 L1140,480" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="500" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">intent rises, the burden shifts from writing to verifying</text>
</svg>
