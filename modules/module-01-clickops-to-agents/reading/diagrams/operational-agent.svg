<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An operational agent loops: schedule, read live evidence, compare, report, escalate, back to schedule, captioned read-only, fresh evidence, a kill switch.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="700" height="420">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="91" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="white"/>
  <text x="350" y="32" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="20" fill="#1e1e1e">An operational agent runs across time</text>

  <g stroke="#1e1e1e" stroke-width="2.2" fill="white" filter="url(#sketch)">
    <rect x="60"  y="180" width="130" height="60" rx="10"/>
    <rect x="240" y="110" width="150" height="60" rx="10"/>
    <rect x="440" y="180" width="130" height="60" rx="10"/>
    <rect x="440" y="270" width="130" height="60" rx="10"/>
    <rect x="240" y="270" width="150" height="60" rx="10"/>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" text-anchor="middle" fill="#1e1e1e">
    <text x="125" y="215">schedule</text>
    <text x="315" y="145">read live evidence</text>
    <text x="505" y="215">compare</text>
    <text x="505" y="305">report</text>
    <text x="315" y="305">escalate</text>
  </g>

  <g stroke="#1e1e1e" stroke-width="2.2" fill="none" filter="url(#sketch)">
    <path d="M170,190 C 200,160 220,150 240,140" marker-end="url(#arrow)"/>
    <path d="M390,140 C 415,150 430,160 445,175" marker-end="url(#arrow)"/>
    <path d="M505,240 L507,268" marker-end="url(#arrow)"/>
    <path d="M440,300 L392,300" marker-end="url(#arrow)"/>
    <path d="M240,290 C 190,270 150,250 130,242" marker-end="url(#arrow)"/>
  </g>

  <text x="350" y="380" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="#1e1e1e" font-style="italic">read-only, fresh evidence every run, a kill switch to stop it</text>
</svg>
