<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Helm 3, security support ending February 2027, next to Helm 4, the version this course teaches.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">

    <rect x="90" y="70" width="300" height="150" rx="10" stroke="black" stroke-width="2.2" fill="#f8cecc" filter="url(#sketch)"/>
    <text x="240" y="100" text-anchor="middle" font-size="13" fill="black">Helm 3</text>
    <text x="240" y="130" text-anchor="middle" font-size="11" fill="black">last feature release Sept 2026</text>
    <text x="240" y="150" text-anchor="middle" font-size="11" fill="black">security support ends Feb 2027</text>
    <text x="240" y="180" text-anchor="middle" font-size="11" fill="black">still current in a lot of docs</text>

    <rect x="510" y="70" width="300" height="150" rx="10" stroke="black" stroke-width="2.2" fill="#d5e8d4" filter="url(#sketch)"/>
    <text x="660" y="100" text-anchor="middle" font-size="13" fill="black">Helm 4</text>
    <text x="660" y="130" text-anchor="middle" font-size="11" fill="black">what this course teaches</text>
    <text x="660" y="150" text-anchor="middle" font-size="11" fill="black">same chart install/upgrade shape</text>
    <text x="660" y="180" text-anchor="middle" font-size="11" fill="black">actively supported going forward</text>

    <text x="450" y="260" text-anchor="middle" font-size="14" fill="black">not a rewrite to relearn, a version to stop teaching as current</text>
  </g>
</svg>
