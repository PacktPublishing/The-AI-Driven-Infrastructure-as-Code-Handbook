<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A whole Kubernetes cluster running inside one Docker container, its node image pinned by digest so it rebuilds identically every time.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">

    <rect x="250" y="60" width="400" height="180" rx="12" stroke="black" stroke-width="2.4" fill="#dae8fc" filter="url(#sketch)"/>
    <text x="450" y="85" text-anchor="middle" font-size="12" fill="black">docker container: kindest/node</text>

    <rect x="290" y="110" width="140" height="50" rx="8" stroke="black" stroke-width="2" fill="white" filter="url(#sketch)"/>
    <text x="360" y="140" text-anchor="middle" font-size="11" fill="black">control plane</text>

    <rect x="470" y="110" width="140" height="50" rx="8" stroke="black" stroke-width="2" fill="white" filter="url(#sketch)"/>
    <text x="540" y="140" text-anchor="middle" font-size="11" fill="black">kubelet + CNI</text>

    <rect x="290" y="180" width="320" height="40" rx="6" stroke="black" stroke-width="1.6" fill="#f8cecc" filter="url(#sketch)"/>
    <text x="450" y="204" text-anchor="middle" font-size="11" fill="black">pinned by digest, not a floating tag</text>

    <text x="450" y="270" text-anchor="middle" font-size="14" fill="black">torn down and rebuilt identically, every learner, every time</text>
  </g>
</svg>
