<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crossplane v1's extra claim object next to v2's namespaced composite resource doing the same job directly, with the claim removed.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">

    <text x="220" y="55" text-anchor="middle" font-size="12" fill="black">Crossplane v1</text>
    <rect x="100" y="70" width="130" height="50" rx="8" stroke="black" stroke-width="2" fill="#ffe6cc" filter="url(#sketch)"/>
    <text x="165" y="100" text-anchor="middle" font-size="11" fill="black">claim</text>
    <path d="M230,95 L300,95" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="300" y="70" width="130" height="50" rx="8" stroke="black" stroke-width="2" fill="#dae8fc" filter="url(#sketch)"/>
    <text x="365" y="100" text-anchor="middle" font-size="11" fill="black">cluster-scoped XR</text>

    <text x="680" y="55" text-anchor="middle" font-size="12" fill="black">Crossplane v2</text>
    <rect x="580" y="70" width="220" height="50" rx="8" stroke="black" stroke-width="2.4" fill="#d5e8d4" filter="url(#sketch)"/>
    <text x="690" y="100" text-anchor="middle" font-size="11" fill="black">namespaced XR, requested directly</text>

    <text x="450" y="170" text-anchor="middle" font-size="12" fill="black">one fewer object, one fewer indirection</text>
    <text x="450" y="200" text-anchor="middle" font-size="12" fill="black">your namespace boundary is now the resource boundary</text>
  </g>
</svg>
