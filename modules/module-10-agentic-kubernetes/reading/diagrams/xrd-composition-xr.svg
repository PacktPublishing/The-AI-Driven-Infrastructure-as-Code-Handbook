<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XRD, Composition, and XR mapped against Terraform's provider, module, and resource, the same generate-verify-fix shape under different names.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">

    <text x="180" y="55" text-anchor="middle" font-size="11" fill="black">Terraform</text>
    <rect x="70" y="70" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#dae8fc" filter="url(#sketch)"/>
    <text x="180" y="98" text-anchor="middle" font-size="11" fill="black">provider</text>
    <rect x="70" y="130" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#dae8fc" filter="url(#sketch)"/>
    <text x="180" y="158" text-anchor="middle" font-size="11" fill="black">module</text>
    <rect x="70" y="190" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#dae8fc" filter="url(#sketch)"/>
    <text x="180" y="218" text-anchor="middle" font-size="11" fill="black">resource</text>

    <text x="720" y="55" text-anchor="middle" font-size="11" fill="black">Crossplane</text>
    <rect x="610" y="70" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#e1d5e7" filter="url(#sketch)"/>
    <text x="720" y="98" text-anchor="middle" font-size="11" fill="black">XRD, the schema</text>
    <rect x="610" y="130" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#e1d5e7" filter="url(#sketch)"/>
    <text x="720" y="158" text-anchor="middle" font-size="11" fill="black">Composition, the recipe</text>
    <rect x="610" y="190" width="220" height="45" rx="8" stroke="black" stroke-width="2" fill="#e1d5e7" filter="url(#sketch)"/>
    <text x="720" y="218" text-anchor="middle" font-size="11" fill="black">XR, the request</text>

    <path d="M290,92 L610,92" stroke="black" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M290,152 L610,152" stroke="black" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M290,212 L610,212" stroke="black" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <text x="450" y="280" text-anchor="middle" font-size="14" fill="black">same generate-verify-fix shape, different names</text>
  </g>
</svg>
