<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two shapes of multi-agent work side by side, several agents branching in parallel from one task on the left, and a chain of agents in sequence where each one's output feeds the next on the right.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="30" text-anchor="middle" font-size="14" fill="black">Multiple agents, two shapes</text>

    <text x="220" y="60" text-anchor="middle" font-size="12" fill="black">parallel</text>
    <rect x="170" y="80" width="100" height="40" rx="8" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="220" y="105" text-anchor="middle" font-size="11" fill="black">task</text>
    <path d="M220,120 L120,170" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M220,120 L220,170" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M220,120 L320,170" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="70" y="175" width="100" height="40" rx="8" fill="#d5e8d4" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="120" y="200" text-anchor="middle" font-size="10" fill="black">agent a</text>
    <rect x="170" y="175" width="100" height="40" rx="8" fill="#d5e8d4" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="220" y="200" text-anchor="middle" font-size="10" fill="black">agent b</text>
    <rect x="270" y="175" width="100" height="40" rx="8" fill="#d5e8d4" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="320" y="200" text-anchor="middle" font-size="10" fill="black">agent c</text>
    <text x="220" y="250" text-anchor="middle" font-size="11" fill="black">nobody waits on anybody</text>

    <line x1="450" y1="55" x2="450" y2="290" stroke="black" stroke-width="1.4" stroke-dasharray="4 5" filter="url(#sketch)"/>

    <text x="670" y="60" text-anchor="middle" font-size="12" fill="black">sequential</text>
    <rect x="550" y="120" width="110" height="40" rx="8" fill="#ffe6cc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="605" y="145" text-anchor="middle" font-size="10" fill="black">agent 1</text>
    <path d="M660,140 L720,140" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="720" y="120" width="110" height="40" rx="8" fill="#ffe6cc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="775" y="145" text-anchor="middle" font-size="10" fill="black">agent 2</text>
    <text x="690" y="180" text-anchor="middle" font-size="11" fill="black">one's output is the next one's input</text>
    <text x="690" y="250" text-anchor="middle" font-size="11" fill="black">claude code teams: the real, usable tool for this today</text>
  </g>
</svg>
