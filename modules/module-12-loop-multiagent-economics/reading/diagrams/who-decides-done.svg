<svg viewBox="0 0 900 360" width="900" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three ways a loop decides it is finished, side by side: a completion phrase the agent prints, a small model reading the transcript, and a script that runs the scanner against the files on disk. Only the third one reads the repository instead of the conversation.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="360">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" marker360eight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" fill="black">
    <text x="450" y="30" text-anchor="middle" font-size="15">Who decides "done"?</text>
    <rect x="30" y="60" width="260" height="210" rx="12" fill="#f5f5f5" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="160" y="90" text-anchor="middle" font-size="14">completion phrase</text>
    <text x="160" y="110" text-anchor="middle" font-size="10">ralph-loop</text>
    <text x="160" y="150" text-anchor="middle" font-size="12">the agent prints DONE</text>
    <text x="160" y="185" text-anchor="middle" font-size="11">reads: what the agent says</text>
    <text x="160" y="245" text-anchor="middle" font-size="11">judge = the worker</text>
    <rect x="320" y="60" width="260" height="210" rx="12" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="450" y="90" text-anchor="middle" font-size="14">model evaluator</text>
    <text x="450" y="110" text-anchor="middle" font-size="10">/goal</text>
    <text x="450" y="150" text-anchor="middle" font-size="12">a small model reads the chat</text>
    <text x="450" y="185" text-anchor="middle" font-size="11">reads: the transcript only</text>
    <text x="450" y="205" text-anchor="middle" font-size="10">runs no commands, opens no files</text>
    <text x="450" y="245" text-anchor="middle" font-size="11">judge = a second model</text>
    <rect x="610" y="60" width="260" height="210" rx="12" fill="#d5e8d4" stroke="black" stroke-width="3" filter="url(#sketch)"/>
    <text x="740" y="90" text-anchor="middle" font-size="14">deterministic gate</text>
    <text x="740" y="110" text-anchor="middle" font-size="10">Stop hook + verify.sh</text>
    <text x="740" y="150" text-anchor="middle" font-size="12">runs the scanner on the files</text>
    <text x="740" y="185" text-anchor="middle" font-size="11">reads: the repository</text>
    <text x="740" y="205" text-anchor="middle" font-size="10">exit 0 done, 1 not done, 2 no verdict</text>
    <text x="740" y="245" text-anchor="middle" font-size="11">judge = the pipeline</text>
    <path d="M160,290 L160,320 L740,320 L740,290" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#sketch)"/>
    <text x="450" y="345" text-anchor="middle" font-size="12">for infrastructure, the agent proposes and the pipeline decides when to stop</text>
  </g>
</svg>
