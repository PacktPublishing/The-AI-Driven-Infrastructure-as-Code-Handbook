<svg viewBox="0 0 900 360" width="900" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three loop topologies side by side: one agent with a deterministic gate; a maker agent and a checker agent, where the checker's verdict decides; and a lead fanning work out to several agents on separate worktrees, each with its own gate.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="360">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" marker360eight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" fill="black">
    <text x="450" y="30" text-anchor="middle" font-size="15">Three loop topologies</text>
    <text x="150" y="65" text-anchor="middle" font-size="13">one agent and a gate</text>
    <rect x="85" y="90" width="130" height="50" rx="10" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="150" y="120" text-anchor="middle" font-size="12">agent</text>
    <rect x="85" y="190" width="130" height="50" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="150" y="220" text-anchor="middle" font-size="12">gate (script)</text>
    <path d="M140,140 L140,185" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M165,190 L165,145" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <text x="150" y="290" text-anchor="middle" font-size="11">default for anything</text>
    <text x="150" y="306" text-anchor="middle" font-size="11">a scanner or test can check</text>
    <text x="450" y="65" text-anchor="middle" font-size="13">maker and checker</text>
    <rect x="320" y="90" width="110" height="50" rx="10" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="375" y="120" text-anchor="middle" font-size="12">maker</text>
    <rect x="470" y="90" width="110" height="50" rx="10" fill="#e1d5e7" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="525" y="120" text-anchor="middle" font-size="12">checker</text>
    <path d="M430,108 L465,108" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M470,125 L435,125" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="385" y="190" width="130" height="50" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="450" y="220" text-anchor="middle" font-size="12">gate (script)</text>
    <path d="M450,140 L450,185" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <text x="450" y="290" text-anchor="middle" font-size="11">checker for judgment,</text>
    <text x="450" y="306" text-anchor="middle" font-size="11">gate still for facts</text>
    <text x="750" y="65" text-anchor="middle" font-size="13">fan-out on worktrees</text>
    <rect x="695" y="85" width="110" height="40" rx="10" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="750" y="110" text-anchor="middle" font-size="12">lead</text>
    <rect x="630" y="160" width="70" height="40" rx="8" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <rect x="715" y="160" width="70" height="40" rx="8" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <rect x="800" y="160" width="70" height="40" rx="8" fill="#fff2cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="665" y="185" text-anchor="middle" font-size="10">agent</text>
    <text x="750" y="185" text-anchor="middle" font-size="10">agent</text>
    <text x="835" y="185" text-anchor="middle" font-size="10">agent</text>
    <path d="M730,125 L670,155" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M750,125 L750,155" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M770,125 L830,155" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="630" y="215" width="70" height="28" rx="6" fill="#d5e8d4" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <rect x="715" y="215" width="70" height="28" rx="6" fill="#d5e8d4" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <rect x="800" y="215" width="70" height="28" rx="6" fill="#d5e8d4" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <text x="665" y="234" text-anchor="middle" font-size="9">gate</text>
    <text x="750" y="234" text-anchor="middle" font-size="9">gate</text>
    <text x="835" y="234" text-anchor="middle" font-size="9">gate</text>
    <text x="750" y="290" text-anchor="middle" font-size="11">only for independent pieces,</text>
    <text x="750" y="306" text-anchor="middle" font-size="11">when wall-clock is the bottleneck</text>
    <line x1="300" y1="60" x2="300" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="3,5"/>
    <line x1="600" y1="60" x2="600" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="3,5"/>
  </g>
</svg>
