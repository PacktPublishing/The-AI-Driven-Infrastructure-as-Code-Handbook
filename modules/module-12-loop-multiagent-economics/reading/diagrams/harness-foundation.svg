<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A complete harness drawn as a foundation slab, with a loop icon sitting on top labeled not yet built, showing the harness has to exist first.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="30" text-anchor="middle" font-size="14" fill="black">What has to be true first</text>

    <rect x="170" y="200" width="560" height="60" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="450" y="225" text-anchor="middle" font-size="13" fill="black">a complete harness, module 8</text>
    <text x="450" y="244" text-anchor="middle" font-size="11" fill="black">skill + mcp + hook, assembled, already catching mistakes</text>

    <circle cx="450" cy="130" r="55" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="450" y="126" text-anchor="middle" font-size="12" fill="black">loop</text>
    <text x="450" y="144" text-anchor="middle" font-size="10" fill="black">not safe yet</text>

    <text x="450" y="295" text-anchor="middle" font-size="12" fill="black">a loop on a broken harness just repeats the mistakes faster</text>
  </g>
</svg>
