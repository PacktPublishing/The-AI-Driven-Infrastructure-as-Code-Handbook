<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GSD's milestone loop stacked on top of Superpowers' skills: Discuss, Plan, Execute, Verify, Ship above; brainstorming, TDD, verification below. One arrow labelled workflow, one labelled craft.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="340" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="60" y="24" text-anchor="middle" font-size="12" fill="black">workflow</text>
    <path d="M60,310 L60,36" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="60" y="330" text-anchor="middle" font-size="12" fill="black">craft</text>

    <rect x="120" y="30" width="850" height="122" rx="12" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="140" y="54" text-anchor="start" font-size="14" fill="black">GSD, per milestone</text>

    <rect x="150" y="68" width="130" height="44" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="215" y="95" text-anchor="middle" font-size="13" fill="black">Discuss</text>
    <path d="M280,90 L310,90" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <rect x="310" y="68" width="130" height="44" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="375" y="95" text-anchor="middle" font-size="13" fill="black">Plan</text>
    <path d="M440,90 L470,90" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <rect x="470" y="68" width="130" height="44" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="535" y="95" text-anchor="middle" font-size="13" fill="black">Execute</text>
    <path d="M600,90 L630,90" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <rect x="630" y="68" width="130" height="44" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="695" y="95" text-anchor="middle" font-size="13" fill="black">Verify</text>
    <path d="M760,90 L790,90" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <rect x="790" y="68" width="130" height="44" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="855" y="95" text-anchor="middle" font-size="13" fill="black">Ship</text>

    <text x="545" y="138" text-anchor="middle" font-size="11" fill="#666">STATE.md · CONTEXT.md · fresh-context subagents · many sessions</text>

    <path d="M535,152 L535,182" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="548" y="172" text-anchor="start" font-size="11" fill="#666">each task inside Execute</text>

    <rect x="120" y="184" width="850" height="122" rx="12" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="140" y="208" text-anchor="start" font-size="14" fill="black">Superpowers, per task</text>

    <rect x="170" y="222" width="165" height="44" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="252" y="249" text-anchor="middle" font-size="13" fill="black">brainstorming</text>
    <rect x="365" y="222" width="165" height="44" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="447" y="249" text-anchor="middle" font-size="13" fill="black">writing-plans</text>
    <rect x="560" y="222" width="165" height="44" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="642" y="249" text-anchor="middle" font-size="13" fill="black">TDD</text>
    <rect x="755" y="222" width="165" height="44" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="837" y="249" text-anchor="middle" font-size="13" fill="black">verification</text>

    <text x="545" y="292" text-anchor="middle" font-size="11" fill="#666">one piece of work, one session, done well</text>

    <text x="545" y="330" text-anchor="middle" font-size="13" fill="black">one change: Superpowers alone. Many phases: GSD on top, Superpowers underneath</text>
  </g>
</svg>
