<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three nested boxes: the runtime harness on the outside, the HARNESS layer inside it, the workflow harness inside that.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="22" width="820" height="276" rx="14" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="66" y="52" text-anchor="start" font-size="15" fill="black">runtime harness</text>
    <text x="66" y="72" text-anchor="start" font-size="11" fill="#666">Claude Code · Codex · Cursor · the program that runs the model (M02)</text>

    <rect x="130" y="92" width="640" height="184" rx="12" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="156" y="120" text-anchor="start" font-size="15" fill="black">HARNESS layer</text>
    <text x="156" y="140" text-anchor="start" font-size="11" fill="#666">skills · MCP · hooks · gates (M04–M06)</text>

    <rect x="250" y="160" width="400" height="92" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="450" y="196" text-anchor="middle" font-size="17" fill="black">workflow harness</text>
    <text x="450" y="220" text-anchor="middle" font-size="12" fill="#333">Superpowers (M08) · skills + a bootstrap</text>
    <text x="450" y="238" text-anchor="middle" font-size="11" fill="#666">this module</text>
  </g>
</svg>
