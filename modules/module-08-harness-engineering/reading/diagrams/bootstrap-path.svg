<svg viewBox="0 0 1000 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The bootstrap path: SessionStart event, the session-start script, the using-superpowers skill file, and the EXTREMELY_IMPORTANT block landing in the agent's context. A second, shorter arrow for Codex labelled skill discovery.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="310">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="310" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="20" y="38" text-anchor="start" font-size="12" fill="#666">Claude Code: a hook carries it</text>

    <rect x="20" y="58" width="200" height="76" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="120" y="88" text-anchor="middle" font-size="13" fill="black">SessionStart</text>
    <text x="120" y="108" text-anchor="middle" font-size="11" fill="#333">startup | clear | compact</text>
    <text x="120" y="124" text-anchor="middle" font-size="11" fill="#666">hooks/hooks.json</text>

    <path d="M220,96 L270,96" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="245" y="84" text-anchor="middle" font-size="11" fill="#666">fires</text>

    <rect x="270" y="58" width="200" height="76" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="370" y="88" text-anchor="middle" font-size="13" fill="black">hooks/session-start</text>
    <text x="370" y="108" text-anchor="middle" font-size="11" fill="#333">a shell script</text>
    <text x="370" y="124" text-anchor="middle" font-size="11" fill="#666">prints JSON the runtime reads</text>

    <path d="M470,96 L520,96" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="495" y="84" text-anchor="middle" font-size="11" fill="#666">reads</text>

    <rect x="520" y="58" width="220" height="76" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="630" y="88" text-anchor="middle" font-size="13" fill="black">using-superpowers/SKILL.md</text>
    <text x="630" y="108" text-anchor="middle" font-size="11" fill="#333">"check for a skill before any action"</text>
    <text x="630" y="124" text-anchor="middle" font-size="11" fill="#666">names actions, not tools</text>

    <path d="M740,96 L790,96" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="765" y="84" text-anchor="middle" font-size="11" fill="#666">wraps</text>

    <rect x="790" y="50" width="195" height="92" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="887" y="76" text-anchor="middle" font-size="12" fill="black">&lt;EXTREMELY_IMPORTANT&gt;</text>
    <text x="887" y="94" text-anchor="middle" font-size="12" fill="#333">... the skill text ...</text>
    <text x="887" y="112" text-anchor="middle" font-size="12" fill="black">&lt;/EXTREMELY_IMPORTANT&gt;</text>
    <text x="887" y="132" text-anchor="middle" font-size="11" fill="#666">in context, every session</text>

    <text x="20" y="188" text-anchor="start" font-size="12" fill="#666">Codex: native skill discovery, no hook</text>
    <rect x="20" y="206" width="200" height="56" rx="8" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="120" y="230" text-anchor="middle" font-size="13" fill="black">Codex manifest</text>
    <text x="120" y="250" text-anchor="middle" font-size="11" fill="#666">"hooks": {} on purpose</text>

    <path d="M220,234 C 560,234 760,234 880,146" stroke="black" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="520" y="256" text-anchor="middle" font-size="11" fill="#666">the skill's own description, "Use when starting any conversation", loads it</text>

    <text x="500" y="296" text-anchor="middle" font-size="13" fill="black">same skills, same bootstrap text, a different delivery path</text>
  </g>
</svg>
