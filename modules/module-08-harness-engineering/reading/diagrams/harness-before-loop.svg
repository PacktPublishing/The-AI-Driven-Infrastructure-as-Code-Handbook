<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A complete harness drawn as a solid foundation, with a loop icon sitting on top of it but not yet built, labeled as M12's job.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="240" y="170" width="400" height="70" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="440" y="200" text-anchor="middle" font-size="15" fill="black">a complete harness</text>
    <text x="440" y="222" text-anchor="middle" font-size="11" fill="#333">context + skill + MCP + hook, assembled</text>

    <rect x="340" y="80" width="200" height="70" rx="10" fill="#e5e5e5" stroke="black" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="440" y="112" text-anchor="middle" font-size="13" fill="#666">a loop</text>
    <text x="440" y="132" text-anchor="middle" font-size="10" fill="#999">not built yet, M12</text>
  </g>
  <text x="440" y="270" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">never add a loop on top of a broken harness</text>
</svg>
