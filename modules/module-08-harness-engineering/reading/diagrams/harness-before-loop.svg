<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A workflow harness drawn as a foundation, with a loop icon on top that is not built yet, labelled as Module 12's job.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="38" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="120" y="170" width="660" height="82" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="450" y="201" text-anchor="middle" font-size="16" fill="black">workflow harness</text>
    <text x="450" y="226" text-anchor="middle" font-size="12" fill="#333">asks, plans, tests first, verifies</text>
    <text x="450" y="243" text-anchor="middle" font-size="11" fill="#666">step 4, gated apply: what step 5 stands on</text>

    <path d="M392,125 A58,58 0 1 1 508,125" stroke="black" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="450" y="108" text-anchor="middle" font-size="14" fill="#666">loop</text>
    <text x="450" y="158" text-anchor="middle" font-size="11" fill="#666">M12, not built yet</text>

    <text x="450" y="284" text-anchor="middle" font-size="14" fill="black">never add a loop on top of a broken harness</text>
  </g>
</svg>
