<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three disciplines in a row: test-first, verify before claiming, and root-cause debugging, each a habit an agent will skip under pressure unless something mechanical stops it.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="70" width="240" height="140" rx="10" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="160" y="110" text-anchor="middle" font-size="15" fill="black">test-first</text>
    <text x="160" y="140" text-anchor="middle" font-size="11" fill="#333">a failing test before</text>
    <text x="160" y="158" text-anchor="middle" font-size="11" fill="#333">any production code</text>

    <rect x="320" y="70" width="240" height="140" rx="10" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="440" y="105" text-anchor="middle" font-size="15" fill="black">verify before</text>
    <text x="440" y="123" text-anchor="middle" font-size="15" fill="black">claiming</text>
    <text x="440" y="153" text-anchor="middle" font-size="11" fill="#333">evidence, not a claim,</text>
    <text x="440" y="171" text-anchor="middle" font-size="11" fill="#333">that something works</text>

    <rect x="600" y="70" width="240" height="140" rx="10" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="720" y="105" text-anchor="middle" font-size="15" fill="black">root-cause</text>
    <text x="720" y="123" text-anchor="middle" font-size="15" fill="black">debugging</text>
    <text x="720" y="153" text-anchor="middle" font-size="11" fill="#333">fix the cause,</text>
    <text x="720" y="171" text-anchor="middle" font-size="11" fill="#333">not the symptom</text>
  </g>
  <text x="440" y="255" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">three habits a harness can enforce mechanically, instead of hoping an agent remembers them</text>
</svg>
