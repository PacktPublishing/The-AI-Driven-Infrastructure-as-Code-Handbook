<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The RED-GREEN-REFACTOR loop redrawn for infrastructure: a failing terraform test, minimal HCL, scan, plan, apply, destroy, with the evidence captured at each step.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="35" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="340" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="40" width="190" height="64" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="135" y="65" text-anchor="middle" font-size="13" fill="black">RED: failing terraform test</text>
    <text x="135" y="86" text-anchor="middle" font-size="11" fill="#333">evidence: test output, 1 failed</text>

    <path d="M230,72 L280,72" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="280" y="40" width="190" height="64" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="375" y="65" text-anchor="middle" font-size="13" fill="black">GREEN: minimal HCL</text>
    <text x="375" y="86" text-anchor="middle" font-size="11" fill="#333">evidence: test output, 0 failed</text>

    <path d="M470,72 L520,72" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="520" y="40" width="190" height="64" rx="8" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="615" y="65" text-anchor="middle" font-size="13" fill="black">checkov</text>
    <text x="615" y="86" text-anchor="middle" font-size="11" fill="#333">evidence: scan count</text>

    <path d="M710,72 L760,72" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="760" y="40" width="190" height="64" rx="8" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="855" y="65" text-anchor="middle" font-size="13" fill="black">terraform plan</text>
    <text x="855" y="86" text-anchor="middle" font-size="11" fill="#333">the proposal: plan output</text>

    <path d="M855,104 L855,196" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="867" y="154" text-anchor="start" font-size="11" fill="#666">human approves</text>

    <rect x="760" y="198" width="190" height="64" rx="8" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="855" y="223" text-anchor="middle" font-size="13" fill="black">apply</text>
    <text x="855" y="244" text-anchor="middle" font-size="11" fill="#333">evidence: apply summary</text>

    <path d="M760,230 L710,230" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="520" y="198" width="190" height="64" rx="8" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="615" y="223" text-anchor="middle" font-size="13" fill="black">destroy</text>
    <text x="615" y="244" text-anchor="middle" font-size="11" fill="#333">evidence: destroy summary</text>

    <path d="M520,230 C 350,230 135,222 135,106" stroke="black" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="330" y="262" text-anchor="middle" font-size="11" fill="#666">back to RED: the next assertion (REFACTOR between)</text>

    <text x="500" y="318" text-anchor="middle" font-size="13" fill="black">four forms of evidence: test output, scan count, apply summary, destroy summary</text>
  </g>
</svg>
