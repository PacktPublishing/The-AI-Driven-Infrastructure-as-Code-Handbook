<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A box of skills with one of them, using-superpowers, pulled out and injected into the session at startup.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="330">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="32" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="330" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="30" y="28" width="580" height="282" rx="12" fill="none" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="320" y="54" text-anchor="middle" font-size="15" fill="black">superpowers plugin</text>

    <rect x="50" y="68" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="135" y="91" text-anchor="middle" font-size="11" fill="black">brainstorming</text>
    <rect x="228" y="68" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="313" y="91" text-anchor="middle" font-size="11" fill="black">writing-plans</text>
    <rect x="406" y="68" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="491" y="91" text-anchor="middle" font-size="11" fill="black">executing-plans</text>

    <rect x="50" y="114" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="135" y="137" text-anchor="middle" font-size="11" fill="black">test-driven-development</text>
    <rect x="228" y="114" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="313" y="137" text-anchor="middle" font-size="11" fill="black">systematic-debugging</text>
    <rect x="406" y="114" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="491" y="137" text-anchor="middle" font-size="11" fill="black">verification-before-completion</text>

    <rect x="50" y="160" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="135" y="183" text-anchor="middle" font-size="11" fill="black">writing-skills</text>
    <rect x="228" y="160" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="313" y="183" text-anchor="middle" font-size="11" fill="black">requesting-code-review</text>
    <rect x="406" y="160" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="491" y="183" text-anchor="middle" font-size="11" fill="black">using-git-worktrees</text>

    <rect x="50" y="206" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="135" y="229" text-anchor="middle" font-size="11" fill="black">subagent-driven-development</text>
    <rect x="228" y="206" width="170" height="36" rx="6" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="313" y="229" text-anchor="middle" font-size="11" fill="black">finishing-a-development-branch</text>
    <rect x="406" y="206" width="170" height="36" rx="6" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#sketch)"/>
    <text x="491" y="229" text-anchor="middle" font-size="11" fill="#666">pulled out</text>

    <text x="320" y="280" text-anchor="middle" font-size="11" fill="#666">15 skills, each a SKILL.md: name, description, body (the M04 format)</text>

    <path d="M576,224 C 640,224 650,88 700,88" stroke="black" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="700" y="68" width="220" height="40" rx="6" fill="#e1d5e7" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="810" y="93" text-anchor="middle" font-size="13" fill="black">using-superpowers</text>

    <path d="M810,108 L810,186" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <text x="822" y="150" text-anchor="start" font-size="11" fill="#666">SessionStart hook</text>

    <rect x="660" y="188" width="300" height="100" rx="12" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="810" y="222" text-anchor="middle" font-size="15" fill="black">session context</text>
    <text x="810" y="246" text-anchor="middle" font-size="11" fill="#666">injected at startup</text>
    <text x="810" y="266" text-anchor="middle" font-size="11" fill="#666">before your first message</text>

    <text x="810" y="318" text-anchor="middle" font-size="12" fill="black">one injected skill makes the other fourteen live</text>
  </g>
</svg>
