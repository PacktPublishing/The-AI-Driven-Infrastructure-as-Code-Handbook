<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="M01's three-layer diagnostic revisited: the symptom it ignores our standards points to the harness layer, not the context layer.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="60" y="40" width="330" height="80" rx="10" fill="#f8cecc" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="225" y="72" text-anchor="middle" font-size="14" fill="black">"it ignores our standards"</text>
    <text x="225" y="94" text-anchor="middle" font-size="11" fill="#333">the symptom</text>

    <path d="M225,120 L225,155" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="60" y="165" width="150" height="70" rx="8" fill="#e5e5e5" stroke="black" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#sketch)"/>
    <text x="135" y="195" text-anchor="middle" font-size="12" fill="#999">context</text>
    <text x="135" y="215" text-anchor="middle" font-size="10" fill="#999">not this</text>

    <rect x="245" y="165" width="150" height="70" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="320" y="195" text-anchor="middle" font-size="12" fill="black">harness</text>
    <text x="320" y="215" text-anchor="middle" font-size="10" fill="black">this module</text>

    <text x="620" y="90" text-anchor="middle" font-size="13" fill="black">"can't get one task right at all"</text>
    <text x="620" y="112" text-anchor="middle" font-size="11" fill="#999">that's context (M03), a different symptom</text>
  </g>
</svg>
