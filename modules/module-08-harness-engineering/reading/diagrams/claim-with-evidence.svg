<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same claim, this time with real captured checkov output right beside it, and the hook lets it through.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="51" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="40" width="360" height="120" rx="10" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="220" y="68" text-anchor="middle" font-size="12" fill="black">$ checkov -d . --compact --quiet</text>
    <text x="220" y="90" text-anchor="middle" font-size="12" fill="black">Passed checks: 11, Failed checks: 5</text>
    <text x="220" y="118" text-anchor="middle" font-size="12" fill="black">"the two checks this fix targets pass"</text>
    <text x="220" y="150" text-anchor="middle" font-size="11" fill="#999">real output, right beside the claim</text>

    <path d="M410,100 L520,100" stroke="black" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="530" y="55" width="290" height="90" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="675" y="95" text-anchor="middle" font-size="15" fill="black">hook: PASS</text>
    <text x="675" y="117" text-anchor="middle" font-size="11" fill="#333">claim found, evidence found</text>
  </g>
  <text x="440" y="230" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">same claim, same words, the only thing that changed is the evidence</text>
</svg>
