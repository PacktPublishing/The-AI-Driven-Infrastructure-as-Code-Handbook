<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A skill, an MCP server, and a hook, three pieces taught separately, converging into one labeled system: a harness.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="30" width="180" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="130" y="55" text-anchor="middle" font-size="13" fill="black">skill</text>
    <text x="130" y="75" text-anchor="middle" font-size="11" fill="#666">M04, voluntary</text>

    <rect x="40" y="120" width="180" height="60" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="130" y="145" text-anchor="middle" font-size="13" fill="black">MCP server</text>
    <text x="130" y="165" text-anchor="middle" font-size="11" fill="#666">M05, a live connection</text>

    <rect x="40" y="210" width="180" height="60" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="130" y="235" text-anchor="middle" font-size="13" fill="black">hook</text>
    <text x="130" y="255" text-anchor="middle" font-size="11" fill="#666">M06, enforced</text>

    <path d="M220,60 L420,140" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M220,150 L420,150" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M220,240 L420,160" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="430" y="100" width="300" height="100" rx="12" fill="#d5e8d4" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="580" y="145" text-anchor="middle" font-size="18" fill="black">a harness</text>
    <text x="580" y="170" text-anchor="middle" font-size="12" fill="#333">one assembled system,</text>
    <text x="580" y="186" text-anchor="middle" font-size="12" fill="#333">not three separate lessons</text>
  </g>
</svg>
