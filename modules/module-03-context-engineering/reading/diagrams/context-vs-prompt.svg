<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two panels compared: standing context that is reused on every run, versus a one-off prompt that is spent once and then gone.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="820" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="white"/>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="60" y="60" width="330" height="200" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="225" y="95" text-anchor="middle" font-size="19" fill="black">context engineering</text>
    <text x="225" y="130" text-anchor="middle" font-size="14" fill="black">AGENTS.md, repo shape,</text>
    <text x="225" y="150" text-anchor="middle" font-size="14" fill="black">provider pins, policy text</text>
    <text x="225" y="190" text-anchor="middle" font-size="14" fill="black">written once,</text>
    <text x="225" y="210" text-anchor="middle" font-size="14" fill="black">true on every run</text>

    <rect x="430" y="60" width="330" height="200" rx="10" fill="#ffe6cc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="595" y="95" text-anchor="middle" font-size="19" fill="black">a prompt</text>
    <text x="595" y="130" text-anchor="middle" font-size="14" fill="black">"build me a VPC</text>
    <text x="595" y="150" text-anchor="middle" font-size="14" fill="black">with two subnets"</text>
    <text x="595" y="190" text-anchor="middle" font-size="14" fill="black">asked once,</text>
    <text x="595" y="210" text-anchor="middle" font-size="14" fill="black">spent, gone</text>
  </g>

  <text x="410" y="295" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="15" fill="black">context is what's true about the repo every time, a prompt is what's asked once</text>
</svg>
