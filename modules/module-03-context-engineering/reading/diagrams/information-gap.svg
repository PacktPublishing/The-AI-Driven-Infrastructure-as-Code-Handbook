<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fourteen policy failures shown as dots, eleven turn green once policy text is made visible to the agent, three stay red.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="white"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="20" fill="black">the information gap</text>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">
    <text x="60" y="90">14 policy failures</text>
  </g>
  <g stroke="black" stroke-width="1.8" filter="url(#sketch)">
    <circle cx="90" cy="130" r="12" fill="#d5e8d4"/><circle cx="130" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="170" cy="130" r="12" fill="#d5e8d4"/><circle cx="210" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="250" cy="130" r="12" fill="#d5e8d4"/><circle cx="290" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="330" cy="130" r="12" fill="#d5e8d4"/><circle cx="370" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="410" cy="130" r="12" fill="#d5e8d4"/><circle cx="450" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="490" cy="130" r="12" fill="#d5e8d4"/>
    <circle cx="530" cy="130" r="12" fill="#f8cecc"/>
    <circle cx="570" cy="130" r="12" fill="#f8cecc"/>
    <circle cx="610" cy="130" r="12" fill="#f8cecc"/>
  </g>

  <text x="90" y="175" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">11 resolved once policy text became visible</text>
  <text x="530" y="175" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">3 remain</text>

  <text x="400" y="240" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="17" fill="black">11 of 14, not a rounded 79%</text>
  <text x="400" y="270" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">the fix was not a smarter agent, it was making the rule readable</text>
</svg>
