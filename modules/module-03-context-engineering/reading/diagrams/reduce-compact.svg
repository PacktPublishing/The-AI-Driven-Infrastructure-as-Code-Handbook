<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real measured checkov output on the same 21-resource module: plain output is 25,605 characters, compact output is 3,881 characters, an 85% reduction, with the same 25 findings either way.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="820" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="white"/>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="60" y="50" width="320" height="200" rx="10" fill="#f8cecc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="220" y="85" text-anchor="middle" font-size="17" fill="black">checkov -d .</text>
    <text x="220" y="115" text-anchor="middle" font-size="13" fill="black">60 passed + 25 failed,</text>
    <text x="220" y="133" text-anchor="middle" font-size="13" fill="black">source lines repeated</text>
    <text x="220" y="195" text-anchor="middle" font-size="24" fill="black">25,605</text>
    <text x="220" y="220" text-anchor="middle" font-size="13" fill="black">characters</text>

    <rect x="440" y="50" width="320" height="200" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="600" y="85" text-anchor="middle" font-size="17" fill="black">checkov -d . --compact</text>
    <text x="600" y="115" text-anchor="middle" font-size="13" fill="black">same 25 failed,</text>
    <text x="600" y="133" text-anchor="middle" font-size="13" fill="black">nothing else printed</text>
    <text x="600" y="195" text-anchor="middle" font-size="24" fill="black">3,881</text>
    <text x="600" y="220" text-anchor="middle" font-size="13" fill="black">characters</text>
  </g>

  <text x="410" y="295" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="15" fill="black">same 25 findings, 85% less to read</text>
</svg>
