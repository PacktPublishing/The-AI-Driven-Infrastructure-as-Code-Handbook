<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same three stacked layers from module one, context, harness, loop, with context highlighted and a note that harness is next, in module six.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="820" height="420">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrowup" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="420" fill="white"/>
  <text x="410" y="34" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="22" fill="black">the three layers, context done for real</text>

  <g stroke="black" stroke-width="2" fill="white">
    <rect x="80" y="270" width="330" height="80" fill="#d5e8d4" filter="url(#sketch)"/>
    <rect x="80" y="180" width="330" height="80" filter="url(#sketch)"/>
    <rect x="80" y="90"  width="330" height="80" filter="url(#sketch)"/>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="black" text-anchor="middle">
    <text x="245" y="315">Context</text>
    <text x="245" y="225">Harness</text>
    <text x="245" y="135">Loop</text>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="15" fill="black">
    <text x="440" y="305">this module, done for real</text>
    <text x="440" y="215">next, in M06</text>
    <text x="440" y="125">later, once context and harness hold</text>
  </g>

  <g stroke="black" stroke-width="2.5" fill="none">
    <path d="M245,378 L245,90" marker-end="url(#arrowup)" filter="url(#sketch)"/>
  </g>
  <text x="245" y="395" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="black">build bottom-up, same rule as M01</text>
</svg>
