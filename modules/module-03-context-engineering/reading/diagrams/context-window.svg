<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A fixed-size context window box divided into segments: task-relevant content, repository noise, and unused space, showing the window as a scarce, shared resource.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="400">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="white"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="22" fill="black">the context window, a fixed box</text>

  <g stroke="black" stroke-width="2.6" fill="none" filter="url(#sketch)">
    <rect x="80" y="70" width="640" height="240"/>
  </g>

  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="82" y="72" width="220" height="236" fill="#d5e8d4" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <text x="192" y="150" text-anchor="middle" font-size="17" fill="black">the task</text>
    <text x="192" y="172" text-anchor="middle" font-size="13" fill="black">the actual intent</text>

    <rect x="302" y="72" width="180" height="236" fill="#ffe6cc" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <text x="392" y="150" text-anchor="middle" font-size="17" fill="black">repo noise</text>
    <text x="392" y="172" text-anchor="middle" font-size="13" fill="black">files nobody asked for</text>

    <rect x="482" y="72" width="130" height="236" fill="#f8cecc" stroke="black" stroke-width="1.6" filter="url(#sketch)"/>
    <text x="547" y="150" text-anchor="middle" font-size="17" fill="black">chat history</text>
    <text x="547" y="172" text-anchor="middle" font-size="13" fill="black">old turns, unpruned</text>

    <rect x="612" y="72" width="108" height="236" fill="white" stroke="black" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="666" y="185" text-anchor="middle" font-size="14" fill="black">still</text>
    <text x="666" y="204" text-anchor="middle" font-size="14" fill="black">free</text>
  </g>

  <text x="400" y="345" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="15" fill="black">every token not spent on the task is a token not spent on getting it right</text>
</svg>
