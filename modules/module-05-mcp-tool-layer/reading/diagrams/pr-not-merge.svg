<svg viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An agent opens a real pull request through the GitHub MCP server, but the merge step is a separate action a human still has to take, the same authority boundary from module one's thesis diagram.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="280">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="15" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="280" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="90" width="170" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="125" y="115" text-anchor="middle" font-size="12" fill="black">agent, via</text>
    <text x="125" y="133" text-anchor="middle" font-size="12" fill="black">github MCP server</text>

    <path d="M210,120 L320,120" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <text x="265" y="108" text-anchor="middle" font-size="11" fill="black">opens</text>

    <rect x="330" y="90" width="170" height="60" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="415" y="115" text-anchor="middle" font-size="12" fill="black">a real, open</text>
    <text x="415" y="133" text-anchor="middle" font-size="12" fill="black">pull request</text>

    <path d="M500,120 L650,120" stroke="black" stroke-width="2.6" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="575" y="100" text-anchor="middle" font-size="12" fill="#c62828">the agent's authority ends here</text>

    <rect x="660" y="60" width="180" height="60" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="750" y="85" text-anchor="middle" font-size="12" fill="black">human</text>
    <text x="750" y="103" text-anchor="middle" font-size="12" fill="black">reviews the diff</text>

    <path d="M750,120 L750,150" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="660" y="155" width="180" height="60" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="750" y="180" text-anchor="middle" font-size="12" fill="black">human clicks</text>
    <text x="750" y="198" text-anchor="middle" font-size="12" fill="black">merge, or doesn't</text>
  </g>
  <text x="440" y="255" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="black">the agent proposes, the pipeline decides, still true even through MCP</text>
</svg>
