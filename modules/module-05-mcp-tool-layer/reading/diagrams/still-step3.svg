<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The six-step autonomy ladder from module one, with step three, propose with plan, highlighted, and a note that MCP adds capability, real tool calls and live data, without moving a workflow to a higher step.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="16" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="440" y="30" text-anchor="middle" font-size="15" fill="black">the six-step ladder from module one</text>

    <g font-size="12">
      <rect x="60" y="230" width="110" height="40" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
      <text x="115" y="254" text-anchor="middle">1 suggest</text>

      <rect x="180" y="205" width="110" height="65" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
      <text x="235" y="240" text-anchor="middle">2 draft</text>

      <rect x="300" y="150" width="130" height="120" fill="#ffe6cc" stroke="black" stroke-width="3" filter="url(#sketch)"/>
      <text x="365" y="200" text-anchor="middle" font-size="13">3 propose</text>
      <text x="365" y="218" text-anchor="middle" font-size="13">with plan</text>
      <text x="365" y="240" text-anchor="middle" font-size="20">←</text>

      <rect x="440" y="155" width="120" height="115" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
      <text x="500" y="215" text-anchor="middle">4 gated apply</text>

      <rect x="570" y="105" width="130" height="165" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
      <text x="635" y="190" text-anchor="middle">5 supervised</text>

      <rect x="710" y="55" width="130" height="215" fill="#dae8fc" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
      <text x="775" y="165" text-anchor="middle">6 unattended</text>
    </g>

    <rect x="270" y="85" width="200" height="50" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="370" y="107" text-anchor="middle" font-size="12" fill="black">MCP adds capability</text>
    <text x="370" y="124" text-anchor="middle" font-size="12" fill="black">real data, not more autonomy</text>
    <path d="M370,135 L370,150" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
  </g>
  <text x="440" y="300" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13" fill="black">a human still reads the plan either way, step 3 either way</text>
</svg>
