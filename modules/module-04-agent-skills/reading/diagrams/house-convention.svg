<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One skill icon connected by arrows to many generated modules, each carrying the same conventions, next to a crossed-out stack of repeated manual review comments.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <circle cx="110" cy="150" r="42" fill="#e1d5e7" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="110" y="155" text-anchor="middle" font-size="12" fill="black">skill</text>

    <path d="M155,120 L260,60" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M155,150 L260,150" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M155,180 L260,240" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="270" y="35" width="140" height="50" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="340" y="65" text-anchor="middle" font-size="11" fill="black">module A: pinned, tagged</text>
    <rect x="270" y="125" width="140" height="50" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="340" y="155" text-anchor="middle" font-size="11" fill="black">module B: pinned, tagged</text>
    <rect x="270" y="215" width="140" height="50" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="340" y="245" text-anchor="middle" font-size="11" fill="black">module C: pinned, tagged</text>

    <rect x="560" y="60" width="270" height="180" rx="8" fill="white" stroke="#999" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="695" y="90" text-anchor="middle" font-size="12" fill="#999">"add tags please" (again)</text>
    <text x="695" y="120" text-anchor="middle" font-size="12" fill="#999">"pin the provider" (again)</text>
    <text x="695" y="150" text-anchor="middle" font-size="12" fill="#999">"no default on secrets" (again)</text>
    <path d="M575,75 L825,225" stroke="#999" stroke-width="2.4" filter="url(#sketch)"/>
    <path d="M825,75 L575,225" stroke="#999" stroke-width="2.4" filter="url(#sketch)"/>
  </g>
  <text x="440" y="280" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">write the rule once, or retype the same review comment every time</text>
</svg>
