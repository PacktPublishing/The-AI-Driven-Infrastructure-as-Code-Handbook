<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two paths compared: a skill, invoked only if the agent decides the task matches, versus a hook, which runs and blocks regardless of what the agent decides.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="880" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="220" y="45" text-anchor="middle" font-size="16" fill="black">skill (voluntary)</text>
    <rect x="60" y="60" width="140" height="55" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="130" y="93" text-anchor="middle" font-size="12" fill="black">agent decides</text>
    <path d="M200,88 L280,88" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="290" y="60" width="140" height="55" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="360" y="93" text-anchor="middle" font-size="12" fill="black">reaches for skill</text>
    <path d="M130,120 L130,150" stroke="black" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <text x="130" y="175" text-anchor="middle" font-size="12" fill="#999">or doesn't, and nothing stops it</text>

    <text x="670" y="45" text-anchor="middle" font-size="16" fill="black">hook (enforced)</text>
    <rect x="510" y="60" width="140" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="580" y="93" text-anchor="middle" font-size="12" fill="black">action attempted</text>
    <path d="M650,88 L730,88" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="740" y="60" width="120" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="800" y="93" text-anchor="middle" font-size="12" fill="black">gate runs</text>
    <path d="M580,120 L580,150" stroke="black" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <text x="580" y="175" text-anchor="middle" font-size="12" fill="black">blocked if it fails, every time</text>
  </g>
  <text x="440" y="260" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">a skill can only ever suggest, a hook can actually stop the action</text>
</svg>
