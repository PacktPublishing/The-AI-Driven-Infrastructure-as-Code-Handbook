<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The six-step autonomy ladder from Module 1, step 3 highlighted: the agent proposes code and a plan, a human still reads both before anything runs.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="760" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="13">
    <rect x="60" y="270" width="620" height="40" rx="6" fill="white" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="80" y="295" fill="black">1 · suggest</text>

    <rect x="60" y="225" width="620" height="40" rx="6" fill="white" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="80" y="250" fill="black">2 · draft</text>

    <rect x="60" y="180" width="620" height="40" rx="6" fill="#dae8fc" stroke="black" stroke-width="3" filter="url(#sketch)"/>
    <text x="80" y="205" font-size="14" fill="black">3 · propose with plan — you are here</text>

    <rect x="60" y="135" width="620" height="40" rx="6" fill="white" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="80" y="160" fill="black">4 · gated apply</text>

    <rect x="60" y="90" width="620" height="40" rx="6" fill="white" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="80" y="115" fill="black">5 · supervised</text>

    <rect x="60" y="45" width="620" height="40" rx="6" fill="white" stroke="black" stroke-width="1.8" filter="url(#sketch)"/>
    <text x="80" y="70" fill="black">6 · unattended</text>
  </g>
  <text x="380" y="335" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">the skill changed what got proposed, not who reads the plan before apply</text>
</svg>
