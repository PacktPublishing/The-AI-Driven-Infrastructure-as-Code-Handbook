<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three panels compared: standing context that loads on every run, a skill that loads only when a task matches, and a one-off prompt that is spent once.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="60" width="270" height="200" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="175" y="95" text-anchor="middle" font-size="18" fill="black">context</text>
    <text x="175" y="130" text-anchor="middle" font-size="13" fill="black">AGENTS.md</text>
    <text x="175" y="190" text-anchor="middle" font-size="13" fill="black">always loaded,</text>
    <text x="175" y="210" text-anchor="middle" font-size="13" fill="black">every run</text>

    <rect x="345" y="60" width="270" height="200" rx="10" fill="#dae8fc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="480" y="95" text-anchor="middle" font-size="18" fill="black">skill</text>
    <text x="480" y="130" text-anchor="middle" font-size="13" fill="black">SKILL.md</text>
    <text x="480" y="190" text-anchor="middle" font-size="13" fill="black">loaded on demand,</text>
    <text x="480" y="210" text-anchor="middle" font-size="13" fill="black">only if matched</text>

    <rect x="650" y="60" width="270" height="200" rx="10" fill="#ffe6cc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="785" y="95" text-anchor="middle" font-size="18" fill="black">prompt</text>
    <text x="785" y="130" text-anchor="middle" font-size="13" fill="black">"build me a bucket"</text>
    <text x="785" y="190" text-anchor="middle" font-size="13" fill="black">asked once,</text>
    <text x="785" y="210" text-anchor="middle" font-size="13" fill="black">spent, gone</text>
  </g>
  <text x="480" y="295" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">always on, on demand, or once: pick the layer by asking which one it is</text>
</svg>
