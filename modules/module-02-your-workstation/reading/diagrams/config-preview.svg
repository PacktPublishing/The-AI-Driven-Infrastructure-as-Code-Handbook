<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two empty, dashed file icons, CLAUDE.md and AGENTS.md, sitting at the root of a repo, both marked empty for now with a note that they get filled in during module 3.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="280">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="280" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="35" text-anchor="middle" font-size="16" fill="black">where standing config will live</text>

    <rect x="220" y="70" width="160" height="120" rx="8" fill="none" stroke="black" stroke-width="2.2" stroke-dasharray="7 6" filter="url(#sketch)"/>
    <text x="300" y="140" text-anchor="middle" font-size="13" fill="black">CLAUDE.md</text>
    <text x="300" y="160" text-anchor="middle" font-size="11" fill="black">empty, for now</text>

    <rect x="520" y="70" width="160" height="120" rx="8" fill="none" stroke="black" stroke-width="2.2" stroke-dasharray="7 6" filter="url(#sketch)"/>
    <text x="600" y="140" text-anchor="middle" font-size="13" fill="black">AGENTS.md</text>
    <text x="600" y="160" text-anchor="middle" font-size="11" fill="black">empty, for now</text>

    <rect x="150" y="215" width="600" height="30" rx="4" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="450" y="235" text-anchor="middle" font-size="12" fill="black">filled in for real in module 3, context engineering</text>
  </g>
</svg>
