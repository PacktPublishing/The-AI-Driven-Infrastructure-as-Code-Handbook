<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four pinned tool boxes, Terraform, Checkov, Trivy, and the Docker socket, each version-pinned, installed directly on one machine, showing one shared starting point everyone gets.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="35" text-anchor="middle" font-size="16" fill="black">pinned tool versions</text>

    <rect x="80" y="130" width="150" height="80" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="155" y="165" text-anchor="middle" font-size="13" fill="black">Terraform</text>
    <text x="155" y="185" text-anchor="middle" font-size="11" fill="black">1.16.0</text>

    <rect x="260" y="130" width="150" height="80" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="335" y="165" text-anchor="middle" font-size="13" fill="black">Checkov</text>
    <text x="335" y="185" text-anchor="middle" font-size="11" fill="black">3.3.16</text>

    <rect x="440" y="130" width="150" height="80" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="515" y="165" text-anchor="middle" font-size="13" fill="black">Trivy</text>
    <text x="515" y="185" text-anchor="middle" font-size="11" fill="black">0.74.0</text>

    <rect x="620" y="130" width="200" height="80" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="720" y="165" text-anchor="middle" font-size="13" fill="black">Docker socket</text>
    <text x="720" y="185" text-anchor="middle" font-size="11" fill="black">reachable on your machine</text>

    <rect x="60" y="215" width="780" height="26" rx="4" fill="#bdbdbd" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="450" y="233" text-anchor="middle" font-size="12" fill="black">one set of pinned versions, installed directly, every learner starts the same way</text>

    <text x="450" y="280" text-anchor="middle" font-size="13" fill="black">no "works on my machine"</text>
  </g>
</svg>
