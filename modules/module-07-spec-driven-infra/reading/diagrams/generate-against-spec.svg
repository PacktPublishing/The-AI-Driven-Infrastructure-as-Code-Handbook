<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A spec document feeding into an agent, the agent generating a module, and the module being checked against each numbered acceptance criterion from the spec, one arrow per criterion, not one arrow labeled looks right.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="30" y="120" width="140" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="100" y="155" text-anchor="middle" font-size="12" fill="black">spec</text>

    <path d="M170,150 L220,150" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="230" y="120" width="140" height="60" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="300" y="155" text-anchor="middle" font-size="12" fill="black">agent generates</text>

    <path d="M370,150 L420,150" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="430" y="120" width="140" height="60" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="500" y="155" text-anchor="middle" font-size="12" fill="black">the module</text>

    <path d="M570,140 C 620,90 650,70 680,55" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M570,150 L680,150" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M570,160 C 620,210 650,230 680,245" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="690" y="30" width="180" height="40" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="780" y="55" text-anchor="middle" font-size="11" fill="black">SC-001 versioning?</text>

    <rect x="690" y="130" width="180" height="40" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="780" y="155" text-anchor="middle" font-size="11" fill="black">SC-002 access block?</text>

    <rect x="690" y="225" width="180" height="40" rx="6" fill="#d5e8d4" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="780" y="250" text-anchor="middle" font-size="11" fill="black">SC-003 encrypted?</text>

    <text x="450" y="290" text-anchor="middle" font-size="13" fill="black">checked against each numbered criterion, not eyeballed</text>
  </g>
</svg>
