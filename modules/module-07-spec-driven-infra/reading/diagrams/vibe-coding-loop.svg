<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A loop: generate, eyeball, tweak, eyeball again, going in a circle with no exit arrow and no written target box anywhere in the loop, crossed out with a single stroke.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="45" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="500" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="220" y="30" width="160" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="300" y="63" text-anchor="middle" font-size="13" fill="black">generate</text>

    <rect x="420" y="180" width="160" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="500" y="213" text-anchor="middle" font-size="13" fill="black">eyeball it</text>

    <rect x="220" y="330" width="160" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="300" y="363" text-anchor="middle" font-size="13" fill="black">ask for a tweak</text>

    <rect x="20" y="180" width="160" height="55" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="100" y="213" text-anchor="middle" font-size="13" fill="black">eyeball again</text>

    <path d="M378,60 C 430,70 440,140 480,180" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M480,235 C 440,270 400,300 378,335" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M222,358 C 170,340 130,280 100,235" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M100,180 C 130,130 170,90 222,60" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <text x="300" y="450" text-anchor="middle" font-size="14" fill="black">no written target anywhere in this circle</text>

    <line x1="60" y1="55" x2="540" y2="410" stroke="black" stroke-width="3" filter="url(#sketch)"/>
  </g>
</svg>
