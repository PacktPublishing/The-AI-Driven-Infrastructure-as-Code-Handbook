<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A simple decision split: on one side, a throwaway Tier 0 exercise, arrow to a one-line intent is enough; on the other side, anything with real reviewers or real consequences, arrow to write the spec.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="860" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="330" y="20" width="200" height="55" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="430" y="53" text-anchor="middle" font-size="12" fill="black">the ask in front of you</text>

    <path d="M400,75 C 320,110 220,140 180,165" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M460,75 C 540,110 640,140 680,165" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <rect x="40" y="175" width="280" height="55" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="180" y="208" text-anchor="middle" font-size="12" fill="black">throwaway, Tier 0, nobody reviews it</text>

    <rect x="540" y="175" width="280" height="55" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="680" y="208" text-anchor="middle" font-size="12" fill="black">real reviewer, real consequences</text>

    <path d="M180,230 L180,255" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>
    <path d="M680,230 L680,255" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)" fill="none"/>

    <text x="180" y="278" text-anchor="middle" font-size="13" fill="black">a one-line intent is enough</text>
    <text x="680" y="278" text-anchor="middle" font-size="13" fill="black">write the spec</text>
  </g>
</svg>
