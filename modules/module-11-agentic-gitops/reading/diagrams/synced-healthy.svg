<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two independent states, synced-vs-out-of-sync on one axis and healthy-vs-degraded on the other, shown as a small grid rather than a single checkmark.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="30" text-anchor="middle" font-size="14" fill="black">synced and healthy are two different questions</text>

    <text x="330" y="75" text-anchor="middle" font-size="11" fill="black">synced</text>
    <text x="560" y="75" text-anchor="middle" font-size="11" fill="black">out of sync</text>
    <text x="150" y="140" text-anchor="middle" font-size="11" fill="black">healthy</text>
    <text x="150" y="240" text-anchor="middle" font-size="11" fill="black">degraded</text>

    <rect x="240" y="100" width="180" height="90" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="330" y="140" text-anchor="middle" font-size="11" fill="black">the good state</text>
    <text x="330" y="158" text-anchor="middle" font-size="10" fill="black">matches, and works</text>

    <rect x="470" y="100" width="180" height="90" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="560" y="140" text-anchor="middle" font-size="11" fill="black">still reconciling</text>
    <text x="560" y="158" text-anchor="middle" font-size="10" fill="black">drift, sync in progress</text>

    <rect x="240" y="200" width="180" height="90" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="330" y="240" text-anchor="middle" font-size="11" fill="black">the trap</text>
    <text x="330" y="258" text-anchor="middle" font-size="10" fill="black">matches, but broken</text>

    <rect x="470" y="200" width="180" height="90" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="560" y="240" text-anchor="middle" font-size="11" fill="black">worst case</text>
    <text x="560" y="258" text-anchor="middle" font-size="10" fill="black">wrong, and broken</text>
  </g>
</svg>
