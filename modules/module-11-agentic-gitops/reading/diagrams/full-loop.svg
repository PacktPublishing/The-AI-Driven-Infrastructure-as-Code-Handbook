<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The full loop drawn as one continuous path: propose, automatic gate, human merge, automatic reconcile, no other manual step anywhere on the path.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="260">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="260" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="30" text-anchor="middle" font-size="14" fill="black">the full loop, traced end to end</text>

    <rect x="40" y="90" width="150" height="70" rx="10" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="115" y="120" text-anchor="middle" font-size="11" fill="black">agent proposes</text>
    <text x="115" y="140" text-anchor="middle" font-size="10" fill="black">opens a PR</text>

    <path d="M190,125 L245,125" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="250" y="90" width="150" height="70" rx="10" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="325" y="120" text-anchor="middle" font-size="11" fill="black">gate</text>
    <text x="325" y="140" text-anchor="middle" font-size="10" fill="black">automatic</text>

    <path d="M400,125 L455,125" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="460" y="90" width="150" height="70" rx="10" fill="#ffe6cc" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="535" y="120" text-anchor="middle" font-size="11" fill="black">human merges</text>
    <text x="535" y="140" text-anchor="middle" font-size="10" fill="black">the one manual step</text>

    <path d="M610,125 L665,125" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="670" y="90" width="180" height="70" rx="10" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="760" y="120" text-anchor="middle" font-size="11" fill="black">reconcile</text>
    <text x="760" y="140" text-anchor="middle" font-size="10" fill="black">automatic, ongoing</text>

    <text x="450" y="210" text-anchor="middle" font-size="13" fill="black">count the manual steps in this loop. there is exactly one.</text>
  </g>
</svg>
