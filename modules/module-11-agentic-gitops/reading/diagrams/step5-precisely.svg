<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The M01 autonomy ladder, step 5 highlighted, with a note showing exactly what is now automatic against the one thing that still needs a human.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <text x="450" y="30" text-anchor="middle" font-size="14" fill="black">step 5, precisely</text>

    <rect x="80" y="230" width="90" height="40" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="125" y="255" text-anchor="middle" font-size="10" fill="black">1</text>
    <rect x="180" y="210" width="90" height="60" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="225" y="245" text-anchor="middle" font-size="10" fill="black">2</text>
    <rect x="280" y="185" width="90" height="85" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="325" y="230" text-anchor="middle" font-size="10" fill="black">3</text>
    <rect x="380" y="155" width="90" height="115" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="425" y="215" text-anchor="middle" font-size="10" fill="black">4</text>
    <rect x="480" y="110" width="90" height="160" fill="#ffe6cc" stroke="black" stroke-width="2.8" filter="url(#sketch)"/>
    <text x="525" y="195" text-anchor="middle" font-size="11" fill="black">5, here</text>
    <rect x="580" y="80" width="90" height="190" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="625" y="180" text-anchor="middle" font-size="10" fill="black">6</text>

    <text x="525" y="90" text-anchor="middle" font-size="11" fill="black">this module</text>

    <text x="450" y="300" text-anchor="middle" font-size="12" fill="black">automatic: every gate, every sync. manual: reading and merging the PR.</text>
  </g>
</svg>
