<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The module one authority boundary diagram, now with every stage named as a real tool: agent proposes a plan, then trivy and checkov, conftest, infracost, and human approval, then apply, on the pipeline's side of the boundary.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="260">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="66" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="260" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="11">
    <rect x="20" y="90" width="130" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="85" y="115" text-anchor="middle" font-size="12">agent</text>
    <text x="85" y="132" text-anchor="middle" font-size="11">generates a plan</text>

    <line x1="175" y1="20" x2="175" y2="230" stroke="black" stroke-width="2" stroke-dasharray="3 6" filter="url(#sketch)"/>
    <text x="175" y="15" text-anchor="middle" font-size="11">agent's authority ends here</text>

    <path d="M150,120 L200,120" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="205" y="90" width="110" height="60" rx="8" fill="#dae8fc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="260" y="115" text-anchor="middle">trivy +</text>
    <text x="260" y="130" text-anchor="middle">checkov</text>

    <path d="M315,120 L350,120" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="355" y="90" width="100" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="405" y="115" text-anchor="middle">conftest</text>
    <text x="405" y="130" text-anchor="middle">(policy)</text>

    <path d="M455,120 L490,120" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="495" y="90" width="100" height="60" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2" filter="url(#sketch)"/>
    <text x="545" y="115" text-anchor="middle">infracost</text>
    <text x="545" y="130" text-anchor="middle">(cost)</text>

    <path d="M595,120 L640,120" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="645" y="80" width="130" height="80" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="710" y="112" text-anchor="middle">human</text>
    <text x="710" y="128" text-anchor="middle">approval</text>

    <path d="M775,120 L820,120" stroke="black" stroke-width="2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <rect x="825" y="90" width="90" height="60" rx="8" fill="white" stroke="black" stroke-width="2" stroke-dasharray="6 5" filter="url(#sketch)"/>
    <text x="870" y="125" text-anchor="middle">apply</text>

    <text x="590" y="215" text-anchor="middle" font-size="13">every stage on the pipeline's side is now a real, runnable tool</text>
  </g>
</svg>
