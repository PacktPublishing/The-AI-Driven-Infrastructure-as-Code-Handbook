<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identical Terraform code scanned by two tools, Trivy returns 7 HIGH or CRITICAL findings, Checkov returns 25 failed checks, from the same input.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="370" y="20" width="160" height="60" rx="10" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="450" y="45" text-anchor="middle" font-size="13" fill="black">identical Terraform</text>
    <text x="450" y="63" text-anchor="middle" font-size="12" fill="black">21 resources</text>

    <path d="M400,80 L200,150" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>
    <path d="M500,80 L700,150" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="80" y="150" width="240" height="140" rx="10" fill="#f8cecc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="200" y="180" text-anchor="middle" font-size="16" fill="black">Trivy</text>
    <text x="200" y="220" text-anchor="middle" font-size="30" fill="black">7</text>
    <text x="200" y="248" text-anchor="middle" font-size="13" fill="black">HIGH / CRITICAL</text>
    <text x="200" y="266" text-anchor="middle" font-size="13" fill="black">findings</text>

    <rect x="580" y="150" width="240" height="140" rx="10" fill="#f8cecc" stroke="black" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="700" y="180" text-anchor="middle" font-size="16" fill="black">Checkov</text>
    <text x="700" y="220" text-anchor="middle" font-size="30" fill="black">25</text>
    <text x="700" y="248" text-anchor="middle" font-size="13" fill="black">failed</text>
    <text x="700" y="266" text-anchor="middle" font-size="13" fill="black">checks</text>

    <text x="450" y="310" text-anchor="middle" font-size="13" fill="black">real numbers, labs/shared/floci-spike, reproduced live in this chapter's lab</text>
  </g>
</svg>
