<svg viewBox="0 0 840 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A terraform plan in JSON form, parsed into three mechanical checks: does it contain a delete action, does the resource count exceed a threshold, does it touch a resource type on a high-radius list.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="840" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="300" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="30" y="90" width="200" height="110" rx="8" fill="#dae8fc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="130" y="120" text-anchor="middle" font-size="13" fill="black">terraform show</text>
    <text x="130" y="140" text-anchor="middle" font-size="13" fill="black">-json plan.bin</text>
    <text x="130" y="170" text-anchor="middle" font-size="11" fill="black">resource_changes[]</text>

    <path d="M230,145 L300,145" stroke="black" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#sketch)"/>

    <rect x="310" y="30" width="230" height="60" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="425" y="55" text-anchor="middle" font-size="13" fill="black">any action == delete?</text>
    <text x="425" y="75" text-anchor="middle" font-size="11" fill="black">block if block-on-delete</text>

    <rect x="310" y="110" width="230" height="60" rx="8" fill="#ffe6cc" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="425" y="135" text-anchor="middle" font-size="13" fill="black">count &gt; max-resources?</text>
    <text x="425" y="155" text-anchor="middle" font-size="11" fill="black">block if over threshold</text>

    <rect x="310" y="190" width="230" height="60" rx="8" fill="#e1d5e7" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="425" y="215" text-anchor="middle" font-size="13" fill="black">type in high-radius list?</text>
    <text x="425" y="235" text-anchor="middle" font-size="11" fill="black">aws_vpc, aws_iam_role, ...</text>

    <path d="M540,60 L600,140" stroke="black" stroke-width="2" stroke-dasharray="5 4" filter="url(#sketch)"/>
    <path d="M540,140 L600,140" stroke="black" stroke-width="2" stroke-dasharray="5 4" filter="url(#sketch)"/>
    <path d="M540,220 L600,140" stroke="black" stroke-width="2" stroke-dasharray="5 4" filter="url(#sketch)"/>

    <rect x="610" y="105" width="190" height="70" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="705" y="135" text-anchor="middle" font-size="13" fill="black">any yes = block</text>
    <text x="705" y="155" text-anchor="middle" font-size="13" fill="black">all no = pass</text>
  </g>
  <text x="420" y="285" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">the hook never has to understand your infrastructure, only these three shapes</text>
</svg>
