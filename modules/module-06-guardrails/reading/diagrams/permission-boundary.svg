<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A repo divided into two zones, modules where an agent may read and write freely, and shared, walled off with a deny rule the agent cannot argue its way past, set before the run starts.">
  <defs>
    <filter id="sketch" filterUnits="userSpaceOnUse" x="0" y="0" width="820" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="820" height="340" fill="white"/>
  <g font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive">
    <rect x="40" y="60" width="740" height="240" rx="10" fill="none" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="410" y="45" text-anchor="middle" font-size="17" fill="black">the repo</text>

    <rect x="70" y="100" width="330" height="160" rx="8" fill="#d5e8d4" stroke="black" stroke-width="2.2" filter="url(#sketch)"/>
    <text x="235" y="130" text-anchor="middle" font-size="14" fill="black">modules/**</text>
    <text x="235" y="155" text-anchor="middle" font-size="12" fill="black">agent may read + write</text>
    <text x="235" y="175" text-anchor="middle" font-size="12" fill="black">this is normal work</text>

    <rect x="420" y="100" width="330" height="160" rx="8" fill="#f8cecc" stroke="black" stroke-width="2.8" stroke-dasharray="9 5" filter="url(#sketch)"/>
    <text x="585" y="130" text-anchor="middle" font-size="14" fill="black">shared/**</text>
    <text x="585" y="155" text-anchor="middle" font-size="12" fill="black">Write and Edit denied</text>
    <text x="585" y="175" text-anchor="middle" font-size="12" fill="black">set before the run starts</text>
  </g>
  <text x="410" y="315" text-anchor="middle" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="black">a permission boundary asks "should the agent be near this file at all?"</text>
</svg>
